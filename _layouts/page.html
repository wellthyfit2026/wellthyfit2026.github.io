---
layout: default
---
<article class="page">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
  </header>
  {% if page.image %}
  <div class="post-featured-image">
    <img src="{{ page.image }}" alt="{{ page.title }}" loading="lazy">
  </div>
  {% endif %}
  <div class="page-content">
    {{ content }}
  </div>
</article>
